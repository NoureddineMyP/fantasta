<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Giocatori · Fanta Asta 26/27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#EEF6F1', 100: '#D7EBDD', 200: '#AFD7BC', 300: '#7EBC95', 400: '#4C9C6D', 500: '#2B7F4F', 600: '#1F6B41', 700: '#185535', 800: '#123F27', 900: '#0C2A1A' },
                        gold: { 50: '#FBF6E9', 100: '#F3E6C0', 200: '#E7CE8A', 300: '#D8B45C', 400: '#C89B3C', 500: '#AD8330' }
                    }
                }
            }
        }
    </script>
    <style>tbody tr:nth-child(even):not(:hover) { background-color: #FAFAF9; }</style>
</head>

<body class="min-h-screen bg-[#F6F7F5] font-sans text-slate-900">
    <nav class="sticky top-0 z-30 bg-gradient-to-r from-brand-800 to-brand-600 text-white shadow-sm">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 overflow-x-auto px-3 py-3 sm:gap-4 sm:px-6">
            <a href="./index.html" class="flex shrink-0 items-center gap-2 font-extrabold tracking-tight sm:gap-2.5">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white/15 text-sm">FA</span>
                <span class="hidden sm:inline">Fanta Asta <span class="font-medium text-brand-200">26/27</span></span>
            </a>
            <div class="flex shrink-0 items-center gap-0.5 text-xs font-semibold sm:gap-1 sm:text-sm">
                <a href="./index.html" class="whitespace-nowrap rounded-lg px-2.5 py-2 transition hover:bg-white/10 sm:px-3">Dashboard</a>
                <a href="./pre-asta.html" class="whitespace-nowrap rounded-lg px-2.5 py-2 transition hover:bg-white/10 sm:px-3">Pre-asta</a>
                <a href="./asta.html" class="whitespace-nowrap rounded-lg px-2.5 py-2 transition hover:bg-white/10 sm:px-3">Asta live</a>
                <a href="./giocatori.html" class="whitespace-nowrap rounded-lg bg-white/15 px-2.5 py-2 sm:px-3">Giocatori</a>
            </div>
        </div>
    </nav>
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight sm:text-2xl">Database giocatori</h1>
                    <p class="text-sm text-slate-500">Lista completa · 587 giocatori</p>
                </div>
                <div id="resultCount" class="rounded-2xl bg-brand-700 px-4 py-3 font-bold text-white">—</div>
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6">
        <section class="bg-white border border-slate-200 rounded-3xl p-4 shadow-sm">
            <div class="grid gap-3 md:grid-cols-[1fr_180px_220px_auto]">
                <input id="searchInput" class="rounded-xl border border-slate-200 px-4 py-3 outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-100" placeholder="Cerca nome o squadra…">
                <select id="roleFilter" class="rounded-xl border border-slate-200 px-4 py-3">
                    <option value="">Tutti i ruoli</option>
                    <option value="P">P · Portieri</option>
                    <option value="D">D · Difensori</option>
                    <option value="C">C · Centrocampisti</option>
                    <option value="A">A · Attaccanti</option>
                </select>
                <select id="teamFilter" class="rounded-xl border border-slate-200 px-4 py-3">
                    <option value="">Tutte le squadre</option>
                </select>
                <div class="flex flex-wrap gap-2">
                    <label class="flex items-center gap-2 border border-slate-200 rounded-xl px-3 py-3 md:py-0"><input id="onlyListed" type="checkbox" class="accent-brand-600"> Solo in lista</label>
                    <button id="resetFilters" class="rounded-xl bg-slate-100 px-4 py-3 font-bold transition hover:bg-slate-200 md:py-0">Reset</button>
                </div>
            </div>
        </section>
        <section class="mt-6 overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm hidden md:block">
            <table class="w-full min-w-[900px] text-sm">
                <thead class="sticky top-0 bg-slate-50 text-xs uppercase text-slate-400">
                    <tr>
                        <th class="p-3 text-left cursor-pointer select-none hover:text-brand-700" data-sort="name">Giocatore</th>
                        <th>Ruolo</th>
                        <th class="text-left">Squadra</th>
                        <th class="cursor-pointer select-none hover:text-brand-700" data-sort="pgv">PGv</th>
                        <th class="cursor-pointer select-none hover:text-brand-700" data-sort="mv">MV</th>
                        <th class="cursor-pointer select-none hover:text-brand-700" data-sort="fm">FM</th>
                        <th class="cursor-pointer select-none hover:text-brand-700" data-sort="fvm">FVM</th>
                        <th class="cursor-pointer select-none hover:text-brand-700" data-sort="quot">QUOT</th>
                        <th>Lista</th>
                    </tr>
                </thead>
                <tbody id="playersTableBody"></tbody>
            </table>
        </section>
        <section id="playersCards" class="grid gap-3 mt-6 md:hidden"></section>
    </main>
    <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-end"><button id="closeModal"
                    class="bg-slate-100 rounded-xl px-3 py-2 font-bold transition hover:bg-slate-200">Chiudi</button></div>
            <div id="modalBody"></div>
        </div>
    </div>
    <script src="./js/transfermarkt.js"></script>
    <script src="./js/players.js"></script>
</body>

</html>
